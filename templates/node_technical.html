<!DOCTYPE html><html><head><title>Node Technical — Pi IoT Dashboard</title><link rel="stylesheet" href="/static/style.css"></head><body><main class="dashboard">
<header class="header details-header"><div><h1 id="nodeHeading">Node Technical</h1><p><strong id="nodeTechnicalId">{{ node_id }}</strong> — permanent technical identifier</p></div><a class="back-link" href="/nodes">← All Nodes</a></header>
<nav class="node-tabs" aria-label="Node views"><a href="/?node_id={{ node_id|urlencode }}">Dashboard</a><a href="/nodes/{{ node_id|urlencode }}">Details</a><a class="active" href="/nodes/{{ node_id|urlencode }}/technical">Technical</a></nav>
<div id="technicalRoot" data-node-id="{{ node_id }}" class="details-grid"><section class="card"><h2>Runtime Status</h2><dl id="statusDetails" class="detail-list"></dl></section><section class="card"><h2>Device &amp; Hardware</h2><dl id="hardwareDetails" class="detail-list"></dl></section><section class="card"><h2>Firmware</h2><dl id="firmwareDetails" class="detail-list"></dl></section><div id="capabilitiesPanel" class="node-information-panel"><section class="card"><h2>Capabilities</h2><div id="capabilityDetails"></div><div id="capabilityEditor" hidden></div></section><div class="management-actions"><button id="editCapabilities" class="button-primary" disabled>Edit capabilities</button><button id="saveCapabilities" hidden>Save</button><button id="cancelCapabilities" hidden>Cancel</button><span id="capabilityMessage" role="status"></span></div></div></div><p id="nodeError" class="error-message" hidden>Technical information could not be loaded.</p>
</main><script src="/static/node_technical.js"></script></body></html>
