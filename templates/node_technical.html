<!DOCTYPE html><html><head><title>Node Technical — Pi IoT Dashboard</title><link rel="stylesheet" href="/static/style.css"></head><body><main class="dashboard">
<header class="header details-header"><div><h1 id="nodeHeading">Node Technical</h1><p><strong id="nodeTechnicalId">{{ node_id }}</strong> — permanent technical identifier</p></div><a class="back-link" href="/nodes">← All Nodes</a></header>
<nav class="node-tabs" aria-label="Node views"><a href="/?node_id={{ node_id|urlencode }}">Dashboard</a><a href="/nodes/{{ node_id|urlencode }}">Details</a><a class="active" href="/nodes/{{ node_id|urlencode }}/technical">Technical</a><a href="/nodes/{{ node_id|urlencode }}/configuration">Configuration</a></nav>
<div id="technicalRoot" data-node-id="{{ node_id }}" class="details-grid"><section class="card"><h2>Runtime Status</h2><dl id="statusDetails" class="detail-list"></dl></section><section class="card"><h2>Device &amp; Hardware</h2><dl id="hardwareDetails" class="detail-list"></dl></section><section class="card"><h2>Firmware</h2><dl id="firmwareDetails" class="detail-list"></dl></section><section id="capabilitiesPanel" class="card"><h2>Capabilities</h2><div id="capabilityDetails"></div></section><section class="card"><h2>Configuration</h2><dl id="configurationSummary" class="detail-list"></dl><a class="button-link button-secondary" href="/nodes/{{ node_id|urlencode }}/configuration">View Configuration</a></section></div><p id="nodeError" class="error-message" hidden>Technical information could not be loaded.</p>
</main><script src="/static/node_technical.js"></script></body></html>
