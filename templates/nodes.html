<!DOCTYPE html>
<html>
<head>
    <title>All Nodes — Pi IoT Dashboard</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
    <main class="dashboard">
        <header class="header details-header">
            <div>
                <h1>All Nodes</h1>
                <p>Fleet registry and node navigation</p>
            </div>
            <a class="back-link" href="/">Dashboard</a>
        </header>

        <section class="fleet-controls" aria-label="Fleet controls">
            <label class="search-field" for="nodeSearch">
                <span class="visually-hidden">Search nodes</span>
                <input id="nodeSearch" type="search" placeholder="Search nodes..." autocomplete="off">
            </label>
            <div id="selectionToolbar" class="selection-toolbar" hidden>
                <button id="selectAllNodes" type="button">Select All</button>
                <span id="selectionCount" aria-live="polite">0 nodes selected</span>
            </div>
            <button id="toggleSelection" class="button-primary" type="button">Select Nodes</button>
        </section>

        <p id="fleetError" class="error-message" hidden>Fleet state could not be refreshed. Existing values will remain visible.</p>
        <section class="fleet-table-card">
            <table class="fleet-table">
                <thead><tr>
                    <th class="selection-column" hidden><span class="visually-hidden">Select</span></th>
                    <th>Node</th><th>Tags / Groups</th><th>Health</th><th>Actions</th>
                </tr></thead>
                <tbody id="fleetRows"></tbody>
            </table>
            <p id="emptyFleet" class="fleet-empty" hidden>No matching nodes.</p>
        </section>
    </main>
    <script src="/static/nodes.js"></script>
</body>
</html>
