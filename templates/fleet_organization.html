<!DOCTYPE html><html><head><title>Fleet Organization — Pi IoT Dashboard</title><link rel="stylesheet" href="/static/style.css"></head><body><main class="dashboard">
<header class="header details-header"><div><h1>Fleet Organization</h1><p>Create and manage groups and tags used across your fleet</p></div>{% set active_section = 'organization' %}{% include '_primary_nav.html' %}</header>
<div class="organization-tabs" role="tablist"><button class="active" data-kind="group" role="tab">Groups</button><button data-kind="tag" role="tab">Tags</button></div>
<section class="fleet-table-card"><div class="definition-toolbar"><label for="definitionSearch" class="visually-hidden">Search definitions</label><input id="definitionSearch" type="search" placeholder="Search groups..."><button id="newDefinition" class="button-primary">+ New Group</button></div><table class="fleet-table"><thead><tr><th>Name</th><th>Nodes</th><th>Actions</th></tr></thead><tbody id="definitionRows"></tbody></table><p id="definitionEmpty" class="fleet-empty"></p></section>
<dialog id="definitionDialog"><form id="definitionForm"><h2 id="definitionTitle"></h2><label for="definitionName">Name</label><input id="definitionName" required autocomplete="off"><p id="definitionError" class="error-message" role="alert" hidden></p><div class="dialog-actions"><button id="cancelDefinition" type="button">Cancel</button><button class="button-primary" type="submit">Save</button></div></form></dialog>
<dialog id="deleteDialog"><form id="deleteForm"><h2 id="deleteTitle"></h2><p id="deleteMessage"></p><p>The nodes themselves will not be deleted.</p><div class="dialog-actions"><button id="cancelDelete" type="button">Cancel</button><button class="button-primary" type="submit" id="confirmDelete">Delete</button></div></form></dialog>
</main><script src="/static/fleet_organization.js"></script></body></html>
