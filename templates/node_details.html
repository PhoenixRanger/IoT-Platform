<!DOCTYPE html>
<html>
<head>
    <title>Node Details — Pi IoT Dashboard</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
    <main class="dashboard">
        <header class="header details-header">
            <div>
                <h1 id="nodeHeading">Node details</h1>
                <p><strong id="nodeTechnicalId">{{ node_id }}</strong> — permanent technical identifier</p>
            </div>
            <a class="back-link" href="/">← Dashboard</a>
        </header>
        <div id="nodeDetails" data-node-id="{{ node_id }}">
            <div class="details-grid">
                <div id="nodeInformationPanel" class="node-information-panel">
                    <section class="card"><h2>Node Information</h2><dl id="nodeInformation" class="detail-list"></dl></section>
                    <div class="management-actions">
                        <button id="editNode" class="button-primary" type="button" disabled>Edit</button>
                        <button id="saveNode" type="button" hidden>Save</button>
                        <button id="cancelEdit" type="button" hidden>Cancel</button>
                        <span id="saveMessage" role="status"></span>
                    </div>
                </div>
                <section class="card"><h2>Runtime Status</h2><dl id="statusDetails" class="detail-list"></dl></section>
                <section class="card"><h2>Hardware</h2><dl id="hardwareDetails" class="detail-list"></dl></section>
                <section class="card"><h2>Firmware</h2><dl id="firmwareDetails" class="detail-list"></dl></section>
            </div>
        </div>
        <p id="nodeError" class="error-message" hidden>Node information could not be loaded.</p>
    </main>
    <script src="/static/node_details.js"></script>
</body>
</html>
